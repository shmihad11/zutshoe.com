<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Shoe Try-On</title>
  <script src="https://cdn.jsdelivr.net/npm/deepar/deepar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #deepar-canvas { width: 100vw; height: 100vh; }
    .controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
    button { padding: 12px 20px; background: #000; color: #fff; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Camera & AR Render Canvas -->
  <canvas id="deepar-canvas"></canvas>

  <div class="controls">
    <button onclick="switchShoe('shoes_model_1.deepar')">Red Sneakers</button>
    <button onclick="switchShoe('shoes_model_2.deepar')">Blue Sport</button>
  </div>

  <script>
    let deepAR;

    async function initAR() {
      deepAR = await deepar.initialize({
        licenseKey: 'YOUR_DEEPAR_WEB_LICENSE_KEY',
        canvas: document.getElementById('deepar-canvas'),
        effect: 'effects/shoes_model_1.deepar', // DeepAR shoe effect compiled with foot-tracking nodes
        additionalInitOptions: {
          cameraConfig: {
            facingMode: 'environment' // Uses rear camera pointing at feet
          }
        }
      });
    }

    function switchShoe(effectFile) {
      if (deepAR) {
        deepAR.switchEffect(effectFile);
      }
    }

    initAR();
  </script>
</body>
</html>
